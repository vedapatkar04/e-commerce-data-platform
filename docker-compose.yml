version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: ecommerce_oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: deuser
      POSTGRES_PASSWORD: depass
      POSTGRES_DB: ecommerce_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./phase-1-modeling/init.sql:/docker-entrypoint-initdb.d/init.sql  # auto-runs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deuser -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin UI to inspect your DB visually
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: