# schema.yml — dbt tests and documentation
# File: models/staging/schema.yml
#
# This file does two things:
# 1. Documents every model and column
# 2. Defines data quality tests that run with "dbt test"
#
# Backend equivalent: like writing JSDoc + unit tests
# but for your SQL models

version: 2

models:
  - name: stg_users
    description: "Cleaned and standardized users from OLTP source"
    columns:
      - name: user_id
        description: "Unique user identifier"
        tests:
          - unique               # no duplicate user_ids
          - not_null            # every row must have a user_id
      - name: email
        description: "Normalized lowercase email"
        tests:
          - unique
          - not_null
      - name: country
        description: "User country, title-cased"
        tests:
          - not_null

  - name: stg_orders
    description: "Orders joined with line items from OLTP"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - not_null
      - name: order_status
        description: "Current status of the order"
        tests:
          - not_null
          - accepted_values:     # only these values are valid
              values: ['pending', 'processing', 'shipped',
                       'delivered', 'cancelled']
      - name: line_revenue
        description: "Revenue for this line item after discount"
        tests:
          - not_null

  - name: stg_products
    description: "Products with category and price band"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: price_band
        description: "Derived price tier: budget / mid / premium"
        tests:
          - accepted_values:
              values: ['budget', 'mid', 'premium']

  - name: stg_clickstream
    description: "Raw clickstream events from OLTP and Kafka consumer"
    columns:
      - name: event_id
        description: "Unique event identifier"
        tests:
          - unique
          - not_null
      - name: event_type
        description: "Type of user action"
        tests:
          - accepted_values:
              values: ['page_view', 'product_view', 'add_to_cart',
                       'remove_from_cart', 'checkout', 'purchase']

  - name: mart_revenue
    description: "Daily revenue aggregated by country and category"
    columns:
      - name: total_revenue
        description: "Sum of line revenue for delivered orders"
        tests:
          - not_null

  - name: mart_top_products
    description: "Product performance ranked by revenue"
    columns:
      - name: product_id
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null